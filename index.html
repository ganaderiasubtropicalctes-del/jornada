<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preguntas · Jornada Ganadera</title>
<meta name="theme-color" content="#2f5d34">
<style>
:root{--verde:#2f5d34;--verde2:#4f8a3c;--tierra:#8a5a2b;--fondo:#f6f3ea;--tinta:#1f2a1f;--gris:#6b7368;--rojo:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--tinta);font-size:18px;line-height:1.4}
header{background:var(--verde);color:#fff;padding:18px 20px 22px}
header small{opacity:.85;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
header h1{margin:4px 0 0;font-size:24px}
main{padding:16px 18px 40px;max-width:520px;margin:0 auto}
label.t{display:block;font-weight:600;margin:18px 0 8px}
select,textarea,input{width:100%;font:inherit;padding:12px 14px;border:2px solid #d8d2c2;border-radius:12px;background:#fff;color:inherit}
textarea{min-height:90px;resize:vertical}
.grabar{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 6px}
#btnRec{width:160px;height:160px;border-radius:50%;border:none;background:var(--verde2);color:#fff;font-size:19px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
#btnRec .ico{font-size:50px;line-height:1}
#btnRec.on{background:var(--rojo);animation:lat 1.2s infinite}
@keyframes lat{50%{transform:scale(1.05)}}
#tiempo{font-variant-numeric:tabular-nums;color:var(--gris);min-height:1.4em;text-align:center}
.audio-ok{display:none;align-items:center;gap:8px;background:#fff;border:2px solid #cfe3c6;border-radius:12px;padding:8px 10px;margin-top:6px}
.audio-ok audio{flex:1;height:40px;min-width:0}
.audio-ok button{border:none;background:none;font-size:24px;cursor:pointer}
.o{text-align:center;color:var(--gris);margin:16px 0 0}
details{margin-top:18px}
summary{color:var(--verde);font-weight:600;cursor:pointer}
details input{margin-top:10px}
#btnEnviar{width:100%;margin-top:24px;padding:16px;border:none;border-radius:14px;background:var(--tierra);color:#fff;font:inherit;font-weight:700;font-size:20px;cursor:pointer}
#btnEnviar:disabled{opacity:.5}
.msg{margin-top:18px;padding:14px 16px;border-radius:12px;display:none}
.msg.ok{display:block;background:#e3f1dc;border:2px solid #9cc98a}
.msg.esp{display:block;background:#fff4d6;border:2px solid #e6c46a}
.msg.err{display:block;background:#fbe1de;border:2px solid #e39a91}
#cola{font-size:14px;color:var(--gris);margin-top:12px;text-align:center}
footer{text-align:center;font-size:13px;color:var(--gris);padding:0 20px 30px}
</style>
</head>
<body>
<header>
  <small id="organiza"></small>
  <h1 id="evento"></h1>
</header>
<main>
  <label class="t" for="parada">¿Para qué parada es tu pregunta?</label>
  <select id="parada"></select>

  <div class="grabar">
    <button id="btnRec" type="button" aria-label="Grabar pregunta">
      <span class="ico">🎤</span><span id="recTxt">Tocá y hablá</span>
    </button>
    <div id="tiempo"></div>
  </div>
  <div class="audio-ok" id="audioOk">
    <audio id="player" controls preload="metadata"></audio>
    <button type="button" id="btnBorrar" aria-label="Borrar audio">🗑️</button>
  </div>

  <p class="o">o escribila</p>
  <textarea id="texto" placeholder="Escribí tu pregunta acá…" maxlength="2000"></textarea>

  <details>
    <summary>Dejar mis datos para que me respondan después (opcional)</summary>
    <input id="nombre" placeholder="Nombre" autocomplete="name" maxlength="80">
    <input id="telefono" placeholder="Teléfono / WhatsApp" inputmode="tel" autocomplete="tel" maxlength="40">
  </details>

  <button id="btnEnviar" type="button">Enviar pregunta</button>
  <div id="msg" class="msg" role="status"></div>
  <div id="cola"></div>
</main>
<footer>Las preguntas se responden en cada parada. No hace falta registrarse.</footer>

<script>
/* ======== CONFIGURACIÓN: editar solo esto ======== */
const CONFIG = {
  ENDPOINT: 'https://script.google.com/macros/s/AKfycbzL9CEwfF9HzXHi59U_Z6poVkd_3ozKxJtNWWjBGRc9oqTt_eLrMKlFNfd4lR3b0KnX/exec',
  EVENTO: 'Jornada Ganadera',
  ORGANIZA: 'INTA EEA Corrientes',
  MAX_SEG: 120,                     // duración máxima de cada audio
  PARADAS: [
    { id: '1', nombre: 'Parada 1' },
    { id: '2', nombre: 'Parada 2' },
    { id: '3', nombre: 'Parada 3' },
    { id: '4', nombre: 'Parada 4' }
  ]
};
/* ================================================== */

const $ = id => document.getElementById(id);
$('evento').textContent = CONFIG.EVENTO;
$('organiza').textContent = CONFIG.ORGANIZA;
document.title = 'Preguntas · ' + CONFIG.EVENTO;

// --- Paradas (la del QR viene en ?p=N) ---
const sel = $('parada');
const pQR = new URLSearchParams(location.search).get('p');
sel.add(new Option('Elegí la parada…', ''));
CONFIG.PARADAS.forEach(p => sel.add(new Option(p.nombre, p.id)));
if (pQR && CONFIG.PARADAS.some(p => p.id === pQR)) sel.value = pQR;
const nombreParada = id => (CONFIG.PARADAS.find(p => p.id === id) || {}).nombre || ('Parada ' + id);

// --- Grabación en WAV 16 kHz mono (funciona en Android y iPhone, y Gemini lo lee) ---
let rec = null, audioB64 = null, audioSeg = 0, urlPrev = null;

$('btnRec').addEventListener('click', () => rec ? detener() : iniciar());
$('btnBorrar').addEventListener('click', borrarAudio);

async function iniciar() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return aviso('err', 'Este celular no permite grabar desde la página. Escribí la pregunta abajo.');
  }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();               // se crea dentro del toque (necesario en iPhone)
  ctx.resume();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    ctx.close();
    return aviso('err', 'No pudimos usar el micrófono. Tocá “Permitir” cuando el celular lo pida, o escribí la pregunta abajo.');
  }
  await ctx.resume();
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const chunks = [];
  proc.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(proc); proc.connect(ctx.destination);
  const t0 = Date.now();
  const timer = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $('tiempo').textContent = '● Grabando ' + fmt(s) + '  ·  tocá para terminar';
    if (s >= CONFIG.MAX_SEG) detener();
  }, 250);
  rec = { ctx, src, proc, stream, chunks, timer };
  borrarAudio(true);
  $('btnRec').classList.add('on');
  $('recTxt').textContent = 'Tocá para terminar';
  ocultarAviso();
}

function detener() {
  if (!rec) return;
  const { ctx, src, proc, stream, chunks, timer } = rec;
  rec = null;
  clearInterval(timer);
  try { proc.disconnect(); src.disconnect(); } catch (e) {}
  stream.getTracks().forEach(t => t.stop());
  const rate = ctx.sampleRate;
  ctx.close();
  $('btnRec').classList.remove('on');
  $('recTxt').textContent = 'Grabar de nuevo';

  const len = chunks.reduce((a, c) => a + c.length, 0);
  const seg = len / rate;
  if (seg < 1) { $('tiempo').textContent = 'Muy corto. Tocá de nuevo y hablá un poco más.'; return; }
  const all = new Float32Array(len);
  let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const pcm = normalizar(bajarMuestreo(all, rate, 16000));
  const wav = wavDesde(pcm, 16000);
  audioB64 = abABase64(wav);
  audioSeg = Math.round(seg);
  if (urlPrev) URL.revokeObjectURL(urlPrev);
  urlPrev = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
  $('player').src = urlPrev;
  $('audioOk').style.display = 'flex';
  $('tiempo').textContent = '✔ Audio de ' + fmt(audioSeg) + ' listo para enviar';
}

function borrarAudio(silencioso) {
  audioB64 = null; audioSeg = 0;
  $('audioOk').style.display = 'none';
  $('player').removeAttribute('src');
  if (silencioso !== true) { $('tiempo').textContent = ''; $('recTxt').textContent = 'Tocá y hablá'; }
}

function bajarMuestreo(buf, de, a) {
  if (a >= de) return buf;
  const r = de / a, n = Math.floor(buf.length / r), out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const ini = Math.floor(i * r), fin = Math.min(Math.floor((i + 1) * r), buf.length);
    let s = 0; for (let j = ini; j < fin; j++) s += buf[j];
    out[i] = fin > ini ? s / (fin - ini) : 0;
  }
  return out;
}
function normalizar(b) {           // sube el volumen si el productor habló lejos del celular
  let pico = 0; for (let i = 0; i < b.length; i++) pico = Math.max(pico, Math.abs(b[i]));
  if (pico > 0 && pico < 0.5) { const g = Math.min(0.9 / pico, 8); for (let i = 0; i < b.length; i++) b[i] *= g; }
  return b;
}
function wavDesde(pcm, rate) {
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0, o = 44; i < pcm.length; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return buf;
}
function abABase64(buf) {
  const b = new Uint8Array(buf); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

// --- Cola local: si no hay señal, la pregunta queda guardada y se envía sola ---
const memoria = [];
let dbP = null;
function db() {
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('jornada-preguntas', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('cola', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function op(modo, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction('cola', modo), r = fn(tx.objectStore('cola'));
    tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
  });
}
async function colaPoner(it) { try { await op('readwrite', s => s.put(it)); } catch (e) { memoria.push(it); } }
async function colaBorrar(id) {
  try { await op('readwrite', s => s.delete(id)); } catch (e) {}
  const i = memoria.findIndex(x => x.id === id); if (i >= 0) memoria.splice(i, 1);
}
async function colaTodos() {
  let a = []; try { a = await op('readonly', s => s.getAll()) || []; } catch (e) {}
  return a.concat(memoria.filter(m => !a.some(x => x.id === m.id)));
}

let enviando = false;
async function enviarCola() {
  if (enviando || !CONFIG.ENDPOINT.startsWith('https://')) return;
  enviando = true;
  try {
    for (const it of await colaTodos()) {
      try {
        const r = await fetch(CONFIG.ENDPOINT, { method: 'POST', body: JSON.stringify(it) }); // text/plain: sin preflight CORS
        const j = await r.json();
        if (j.ok || j.permanente) await colaBorrar(it.id);
      } catch (e) { break; }  // sin señal: se reintenta después
    }
  } finally { enviando = false; await mostrarCola(); }
}
async function mostrarCola() {
  const n = (await colaTodos()).length;
  $('cola').textContent = n ? '📶 ' + n + (n === 1 ? ' pregunta guardada' : ' preguntas guardadas') + ' en tu celular, se envían solas cuando haya señal.' : '';
  return n;
}
window.addEventListener('online', enviarCola);
document.addEventListener('visibilitychange', () => { if (!document.hidden) enviarCola(); });
setInterval(enviarCola, 20000);
enviarCola();

// --- Envío ---
$('btnEnviar').addEventListener('click', async () => {
  if (rec) detener();
  const parada = sel.value, texto = $('texto').value.trim();
  if (!parada) { sel.focus(); return aviso('err', 'Elegí para qué parada es la pregunta.'); }
  if (!audioB64 && !texto) return aviso('err', 'Grabá un audio o escribí tu pregunta.');
  if (!CONFIG.ENDPOINT.startsWith('https://')) return aviso('err', 'Falta configurar el ENDPOINT en la página.');
  const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const item = {
    id, ts: new Date().toISOString(), parada, paradaNombre: nombreParada(parada), texto,
    nombre: $('nombre').value.trim(), telefono: $('telefono').value.trim(),
    audio: audioB64, mime: 'audio/wav', seg: audioSeg
  };
  $('btnEnviar').disabled = true;
  aviso('esp', 'Enviando…');
  await colaPoner(item);
  borrarAudio(); $('texto').value = '';
  await enviarCola();
  const pendiente = (await colaTodos()).some(x => x.id === id);
  $('btnEnviar').disabled = false;
  if (pendiente) aviso('esp', 'Sin señal ahora. Tu pregunta quedó guardada en el celular y se envía sola apenas haya señal. Podés hacer otra.');
  else aviso('ok', '¡Gracias! Tu pregunta llegó. La respondemos en ' + item.paradaNombre + '. Podés hacer otra cuando quieras.');
});

function aviso(tipo, txt) { const m = $('msg'); m.className = 'msg ' + tipo; m.textContent = txt; }
function ocultarAviso() { $('msg').className = 'msg'; }
</script>
</body>
</html>
